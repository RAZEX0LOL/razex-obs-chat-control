[build-system]
requires = ["setuptools>=80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "razex-obs-chat-control"
version = "1.0.0"
description = "Control a private OBS instance from an allow-listed Twitch chat using EventSub."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Rasul Khattaev" }]
dependencies = [
  "asqlite==2.0.0",
  "simpleobsws==1.4.3",
  "twitchio==3.3.2",
]

[project.optional-dependencies]
dev = [
  "pip-audit==2.10.1",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "ruff==0.16.5",
]

[project.scripts]
obs-chat-control = "obs_chat_control.__main__:main"
obs-chat-demo = "obs_chat_control.demo:main"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "SIM", "RUF"]
ignore = ["S101"]

[tool.setuptools.packages.find]
where = ["src"]
