<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">OBS chat control local demo</title>
  <desc id="desc">A terminal-style view of status, scene, and stop commands using mock data.</desc>
  <rect width="1200" height="600" rx="28" fill="#0b1020"/>
  <rect x="1" y="1" width="1198" height="598" rx="27" fill="none" stroke="#29324d" stroke-width="2"/>
  <circle cx="50" cy="48" r="10" fill="#ff5f57"/>
  <circle cx="82" cy="48" r="10" fill="#febc2e"/>
  <circle cx="114" cy="48" r="10" fill="#28c840"/>
  <text x="600" y="56" text-anchor="middle" fill="#8d9aba" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20">local mock demo</text>
  <line x1="0" y1="82" x2="1200" y2="82" stroke="#29324d" stroke-width="2"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="27">
    <text x="44" y="132" fill="#7dd3fc">streamer&gt;</text><text x="225" y="132" fill="#f8fafc">!status</text>
    <text x="44" y="178" fill="#a7f3d0">bot&gt;</text><text x="150" y="178" fill="#cbd5e1">Source: ready · OBS: live · 5842 kbps · dropped: 0</text>
    <text x="44" y="256" fill="#7dd3fc">streamer&gt;</text><text x="225" y="256" fill="#f8fafc">!scene IRL</text>
    <text x="44" y="302" fill="#a7f3d0">bot&gt;</text><text x="150" y="302" fill="#cbd5e1">Scene changed to IRL.</text>
    <text x="44" y="380" fill="#7dd3fc">streamer&gt;</text><text x="225" y="380" fill="#f8fafc">!stop</text>
    <text x="44" y="426" fill="#a7f3d0">bot&gt;</text><text x="150" y="426" fill="#cbd5e1">Stream stopped.</text>
  </g>
  <rect x="40" y="500" width="1120" height="58" rx="12" fill="#131b31"/>
  <text x="600" y="537" text-anchor="middle" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="21">No Twitch, OBS, or production credentials are used in this demo.</text>
</svg>

